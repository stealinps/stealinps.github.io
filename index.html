<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>stealinp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: black;
            margin: 0;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        #pfp {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="Pictures/bg.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Profile picture fixed to top-left -->
    <img src="Pictures/pfp.jpg" id="pfp" alt="pfp">

    <center>
        <h1 style="color: teal">Syazwan</h1>
        <button style="font-size:14px; background-color:grey; border-radius:15px">
            <a href="https://github.com/stealinps" target="_blank" title="To my Github">
                my Github
            </a>
        </button>
        <br>
        <button style="font-size:14px; background-color:grey; border-radius:15px">
            <a href="project.html" target="_self" title="Projects">
                Projects
            </a>
        </button>
        <p>I'm making my own website hosted via github</p>

    <script src="script.js"></script>

</html>
