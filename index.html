<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: black;

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            top:20px;

            opacity:0.9;

        }
        .buttons{
            height: 50px;
            width: 100px;
            border-radius:5px;
            font-size:14px;
            background-color:white;
        }
        #footing{
            position:fixed;
            align-items: center;
            height:20px;
            width: 100%;
            background-color: teal;
        }

    <video autoplay muted loop playsinline id="bg-video">

    <footer id="footing"><hr><div style="background-color: rgba(0, 0, 139, 0.5); height:50px;"><center>
        <p style="padding-top:10px;">by: <b>s<b style="color:teal">teal</b></b>inp</p>
